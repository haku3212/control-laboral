name: control_laboral_ai
description: Aplicacion Android para administrar registros laborales con Supabase.
publish_to: "none"
version: 0.5.1+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  intl: 0.20.2
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  supabase_flutter: ^2.6.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
